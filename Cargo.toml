[package]
name = "votebase"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["transpile_helpers"]

[workspace.dependencies]
deno_core = "0.328.0"

[dependencies]
deno_core = { workspace = true }
actix-web = "4"
reqwest = "0.12"
serde_json = { version = "1", default-features = false }
tokio = { version = "1.40", features = ["full"] }
transpile_helpers = { path = "./transpile_helpers" }
thiserror = "2"
pretty_env_logger = "0.5"
log = "0.4"

[build-dependencies]
deno_core = { workspace = true }
transpile_helpers = { path = "./transpile_helpers" }
