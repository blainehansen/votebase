[workspace]
resolver = "2"
members = [
	"transpile",
	"common",
	"cli",
	"bootstrap_cli",
	"server",
	"queries",
]

[workspace.dependencies]
deno_core = "0.341.0"
deno_error = "0.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false }
uuid = { version = "*", features = ["serde", "v4"] }
chrono = { version = "*", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
log = "0.4"
thiserror = "2"
