[package]
name = "votebase_common"
version = "0.1.0"
edition = "2024"

[dependencies]
deno_core = { workspace = true }
deno_error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
votebase_transpile = { path = "../transpile" }
reqwest = "0.12"
urlencoding = "2"

futures = "0.3"
walkdir = "2.5"
sqlparser = { version = "0.59", features = ["visitor"] }
postgres-from-row = "0.5"
futures-util = "0.3.31"

# generated_queries = { path = "generated_queries", package = "generated_queries" }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[build-dependencies]
deno_core = { workspace = true }
deno_error = { workspace = true }
votebase_transpile = { path = "../transpile" }

clorinde = { version = "1.1" }
tokio-postgres = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
temp_containers = { path = "../temp_containers" }
